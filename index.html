<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio - Natanael dos Santos</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <!-- Menu -->
  <header>
    <button id="botao-menu">Menu</button>
    <nav id="menu">
      <a href="#sobre">Sobre</a>
      <a href="#portfolio">Portfólio</a>
      <a href="#skills">Skills</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>

  <!-- Sobre -->
  <section id="sobre" class="clara">
    <div class="conteudo sobre">
      <img src="assets/eu.jpeg" alt="Minha foto" class="foto">
      <div>
        <h1>Natanael dos Santos</h1>
        <p>Estudante de Ciência da Computação na UNIT, em Aracaju-SE.</p>
      </div>
    </div>
  </section>

  <!-- Portifólio -->
  <section id="portfolio" class="escura">
    <div class="conteudo">
      <h2>Portfólio</h2>

      <div class="carrossel">
        <button id="seta-esquerda"><</button>

        <div id="lista-projetos">
          <a href="https://www.youtube.com" class="card">
            <img src="" alt="Projeto 1">
            <h3>Projeto 1</h3>
            <p>Descrição do projeto</p>
          </a>

          <a href="link2" class="card">
            <img src="" alt="Projeto 2">
            <h3>Projeto 2</h3>
            <p>Descrição do projeto</p>
          </a>

          <a href="link3" class="card">
            <img src="" alt="Projeto 3">
            <h3>Projeto 3</h3>
            <p>Descrição do projeto</p>
          </a>
        </div>

        <button id="seta-direita">></button>
      </div>
    </div>
  </section>

  <!-- Skills -->
  <section id="skills" class="clara">
    <div class="conteudo">
      <h2>Skills</h2>

      <div class="skill">
        <span>HTML</span>
        <div class="barra"><div class="preenchimento" style="width: 90%"></div></div>
      </div>

      <div class="skill">
        <span>CSS</span>
        <div class="barra"><div class="preenchimento" style="width: 55%"></div></div>
      </div>

      <div class="skill">
        <span>JavaScript</span>
        <div class="barra"><div class="preenchimento" style="width: 75%"></div></div>
      </div>
    </div>
  </section>

</body>
</html>
